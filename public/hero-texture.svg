<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a120c"/>
      <stop offset="38%" stop-color="#2a1c12"/>
      <stop offset="72%" stop-color="#0e1a2c"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#f4d48a" stop-opacity="0.42"/>
      <stop offset="42%" stop-color="#c5a028" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a1a28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2416"/>
      <stop offset="50%" stop-color="#5a3a22"/>
      <stop offset="100%" stop-color="#2c1a10"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a2c"/>
      <stop offset="100%" stop-color="#2a160c"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6c35c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8d89a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e6c35c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="140" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 20 C30 18, 50 26, 90 22 S130 16, 140 20" stroke="#c9a56a" stroke-opacity="0.06" fill="none"/>
      <path d="M0 55 C40 50, 70 62, 110 54 S130 48, 140 52" stroke="#8a6240" stroke-opacity="0.05" fill="none"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#room)"/>
  <rect width="1920" height="1080" fill="url(#grain)"/>
  <rect width="1920" height="1080" fill="url(#lamp)"/>

